name: SearchExplorer
options:
  bundleIdPrefix: com.cityflo.takehome
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  SearchExplorer:
    type: application
    platform: iOS
    sources:
      - path: SearchExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cityflo.takehome.SearchExplorer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Search Explorer
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: YES
  SearchExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SearchExplorerTests
    dependencies:
      - target: SearchExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cityflo.takehome.SearchExplorerTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SearchExplorer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SearchExplorer"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SearchExplorer:
    build:
      targets:
        SearchExplorer: all
        SearchExplorerTests: [test]
    test:
      targets:
        - SearchExplorerTests
